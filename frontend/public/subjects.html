<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subjects | PrepPilot AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #1e293b;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            color: #6366f1;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-name {
            color: #cbd5e1;
            font-size: 14px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #334155;

            color: #cbd5e1;

            padding: 9px 16px;
            border-radius: 8px;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: #1e293b;
        }


        /* ================= MAIN ================= */

        .container {
            max-width: 1070px;
            margin: auto;

            padding: 42px 20px 60px;
        }


        /* ================= HEADER ================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-bottom: 32px;
        }

        .header-left h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .header-left p {
            color: #94a3b8;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .dashboard-btn {
            background: #1e293b;

            border: 1px solid #334155;

            color: #e2e8f0;

            padding: 11px 17px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;
        }

        .dashboard-btn:hover {
            border-color: #6366f1;
        }

        .add-btn {
            background: #6366f1;

            border: none;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            font-size: 13px;
        }

        .add-btn:hover {
            opacity: 0.9;
        }


        /* ================= SUBJECT GRID ================= */

        .subjects-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .subject-card {
            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 15px;

            padding: 25px;

            transition: 0.2s;
        }

        .subject-card:hover {
            border-color: #475569;

            transform: translateY(-2px);
        }

        .subject-icon {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #1e1b4b;

            border: 1px solid #312e81;

            border-radius: 11px;

            font-size: 23px;

            margin-bottom: 18px;
        }

        .subject-card h2 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .subject-description {
            color: #94a3b8;

            font-size: 13px;

            line-height: 1.6;

            min-height: 42px;

            margin-bottom: 22px;
        }

        .view-btn {
            width: 100%;

            background: #1e293b;

            border: 1px solid #334155;

            color: #e2e8f0;

            padding: 11px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .view-btn:hover {
            background: #253249;

            border-color: #6366f1;
        }


        /* ================= EMPTY ================= */

        .empty-state {
            grid-column: 1 / -1;

            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 15px;

            padding: 60px 25px;

            text-align: center;
        }

        .empty-icon {
            font-size: 48px;

            margin-bottom: 15px;
        }

        .empty-state h2 {
            font-size: 20px;

            margin-bottom: 8px;
        }

        .empty-state p {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;

            max-width: 480px;

            margin: auto;
        }


        /* ================= LOADING ================= */

        .loading {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            color: #94a3b8;
        }


        /* ================= ERROR ================= */

        .error-box {
            display: none;

            background: #111827;

            border: 1px solid #7f1d1d;

            color: #fca5a5;

            border-radius: 10px;

            padding: 14px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }


        /* ================= MODAL ================= */

        .modal-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(2, 6, 23, 0.75);

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 100;
        }

        .modal {
            width: 100%;

            max-width: 480px;

            background: #111827;

            border: 1px solid #334155;

            border-radius: 15px;

            padding: 25px;
        }

        .modal-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-btn {
            background: transparent;

            border: none;

            color: #94a3b8;

            font-size: 21px;

            cursor: pointer;
        }

        .close-btn:hover {
            color: white;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            color: #cbd5e1;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .form-input,
        .form-textarea {
            width: 100%;

            background: #0f172a;

            border: 1px solid #334155;

            color: #f8fafc;

            border-radius: 8px;

            padding: 12px;

            outline: none;

            font-size: 14px;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #6366f1;
        }

        .form-textarea {
            min-height: 100px;

            resize: vertical;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;
        }

        .cancel-btn {
            background: #1e293b;

            border: 1px solid #334155;

            color: #cbd5e1;

            padding: 10px 17px;

            border-radius: 8px;

            cursor: pointer;
        }

        .save-btn {
            background: #6366f1;

            border: none;

            color: white;

            padding: 10px 19px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .save-btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 18px;
            }

            .user-name {
                display: none;
            }

            .container {
                padding: 30px 15px 50px;
            }

            .page-header {
                align-items: stretch;

                flex-direction: column;
            }

            .header-left h1 {
                font-size: 26px;
            }

            .header-actions {
                display: grid;

                grid-template-columns: 1fr 1fr;
            }

            .dashboard-btn,
            .add-btn {
                width: 100%;
            }

            .subjects-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🚀 PrepPilot AI
        </div>


        <div class="nav-right">

            <span
                id="userName"
                class="user-name">
                Loading...
            </span>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- ================= HEADER ================= -->

        <div class="page-header">

            <div class="header-left">

                <h1>
                    My Subjects
                </h1>

                <p>
                    Organize your study materials by subject.
                </p>

            </div>


            <div class="header-actions">

                <button
                    class="dashboard-btn"
                    onclick="goDashboard()">

                    ← Dashboard

                </button>


                <button
                    class="add-btn"
                    onclick="openModal()">

                    + Add Subject

                </button>

            </div>

        </div>


        <div
            id="errorBox"
            class="error-box">
        </div>


        <!-- ================= SUBJECTS ================= -->

        <div
            id="subjectsGrid"
            class="subjects-grid">

            <div class="loading">

                📚 Loading your subjects...

            </div>

        </div>


    </main>


    <!-- ================= MODAL ================= -->

    <div
        id="modalOverlay"
        class="modal-overlay">


        <div class="modal">


            <div class="modal-header">

                <h2>
                    Add New Subject
                </h2>


                <button
                    class="close-btn"
                    onclick="closeModal()">

                    ×

                </button>

            </div>


            <form id="subjectForm">


                <div class="form-group">

                    <label for="subjectName">
                        Subject Name
                    </label>

                    <input
                        id="subjectName"
                        class="form-input"
                        type="text"
                        maxlength="100"
                        placeholder="e.g. Spring Boot"
                        required>

                </div>


                <div class="form-group">

                    <label for="subjectDescription">
                        Description
                    </label>

                    <textarea
                        id="subjectDescription"
                        class="form-textarea"
                        maxlength="500"
                        placeholder="e.g. Spring Boot interview preparation">
                    </textarea>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeModal()">

                        Cancel

                    </button>


                    <button
                        id="saveBtn"
                        type="submit"
                        class="save-btn">

                        Save Subject

                    </button>

                </div>


            </form>

        </div>

    </div>


    <script>

        // =====================================================
        // AUTH
        // =====================================================

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "/login.html";

        }


        // =====================================================
        // USER
        // =====================================================

        const storedName =
            localStorage.getItem("userName");


        if (storedName) {

            document.getElementById(
                "userName"
            ).textContent = storedName;

        }


        // =====================================================
        // LOAD SUBJECTS
        // =====================================================

        async function loadSubjects() {

            const grid =
                document.getElementById(
                    "subjectsGrid"
                );


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/api/subjects",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json()
                        .catch(() => []);


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load subjects."
                    );

                }


                renderSubjects(
                    Array.isArray(data)
                        ? data
                        : []
                );


            } catch (error) {

                console.error(error);

                showError(
                    error.message ||
                    "Unable to load subjects."
                );


                grid.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Unable to load subjects
                        </h2>

                        <p>
                            Please check your connection
                            and try again.
                        </p>

                    </div>

                `;

            }

        }


        // =====================================================
        // RENDER SUBJECTS
        // =====================================================

        function renderSubjects(subjects) {

            const grid =
                document.getElementById(
                    "subjectsGrid"
                );


            if (!subjects.length) {

                grid.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📚
                        </div>

                        <h2>
                            No subjects yet
                        </h2>

                        <p>
                            Create your first subject and
                            start organizing your study material.
                        </p>

                    </div>

                `;

                return;

            }


            grid.innerHTML =
                subjects
                    .map(
                        subject =>
                            createSubjectCard(
                                subject
                            )
                    )
                    .join("");

        }


        // =====================================================
        // SUBJECT CARD
        // =====================================================

        function createSubjectCard(subject) {

            const name =
                subject.name ||
                "Untitled Subject";


            const description =
                subject.description ||
                "No description added.";


            return `

                <div class="subject-card">

                    <div class="subject-icon">
                        📚
                    </div>


                    <h2>
                        ${escapeHtml(name)}
                    </h2>


                    <p class="subject-description">

                        ${escapeHtml(description)}

                    </p>


                    <button
                        class="view-btn"
                        onclick="viewSubject(${subject.id})">

                        View Documents →

                    </button>

                </div>

            `;

        }


        // =====================================================
        // VIEW SUBJECT
        // =====================================================

        function viewSubject(subjectId) {

            localStorage.setItem(
                "currentSubjectId",
                subjectId
            );


            window.location.href =
                "/documents.html?subjectId="
                + subjectId;

        }


        // =====================================================
        // ADD SUBJECT
        // =====================================================

        const subjectForm =
            document.getElementById(
                "subjectForm"
            );


        subjectForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "subjectName"
                    ).value.trim();


                const description =
                    document.getElementById(
                        "subjectDescription"
                    ).value.trim();


                if (!name) {

                    showError(
                        "Subject name is required."
                    );

                    return;

                }


                const saveBtn =
                    document.getElementById(
                        "saveBtn"
                    );


                saveBtn.disabled = true;

                saveBtn.textContent =
                    "Saving...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:8080/api/subjects",
                            {
                                method: "POST",

                                headers: {
                                    "Authorization":
                                        "Bearer " + token,

                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name: name,
                                    description:
                                        description
                                })
                            }
                        );


                    const data =
                        await response.json()
                            .catch(() => ({}));


                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {

                        localStorage.clear();

                        window.location.href =
                            "/login.html";

                        return;

                    }


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Unable to create subject."
                        );

                    }


                    closeModal();

                    await loadSubjects();


                } catch (error) {

                    console.error(error);

                    showError(
                        error.message ||
                        "Unable to create subject."
                    );

                } finally {

                    saveBtn.disabled = false;

                    saveBtn.textContent =
                        "Save Subject";

                }

            }
        );


        // =====================================================
        // MODAL
        // =====================================================

        function openModal() {

            document.getElementById(
                "modalOverlay"
            ).style.display =
                "flex";


            document.getElementById(
                "subjectName"
            ).focus();

        }


        function closeModal() {

            document.getElementById(
                "modalOverlay"
            ).style.display =
                "none";


            document.getElementById(
                "subjectForm"
            ).reset();

        }


        // Close modal by clicking outside

        document.getElementById(
            "modalOverlay"
        ).addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    this
                ) {

                    closeModal();

                }

            }
        );


        // =====================================================
        // DASHBOARD
        // =====================================================

        function goDashboard() {

            window.location.href =
                "/dashboard.html";

        }


        // =====================================================
        // LOGOUT
        // =====================================================

        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("userId");

            localStorage.removeItem("userName");

            localStorage.removeItem("userEmail");

            localStorage.removeItem(
                "currentSubjectId"
            );


            window.location.href =
                "/login.html";

        }


        // =====================================================
        // ERROR
        // =====================================================

        function showError(message) {

            const box =
                document.getElementById(
                    "errorBox"
                );


            box.textContent =
                message;


            box.style.display =
                "block";


            setTimeout(
                () => {
                    box.style.display =
                        "none";
                },
                4000
            );

        }


        // =====================================================
        // HTML ESCAPE
        // =====================================================

        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // =====================================================
        // INITIAL LOAD
        // =====================================================

        loadSubjects();

    </script>

</body>

</html>
