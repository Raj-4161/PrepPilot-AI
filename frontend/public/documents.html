<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Documents | PrepPilot AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f172a;color:#f8fafc;min-height:100vh}
.navbar{height:70px;background:#111827;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.logo{color:#6366f1;font-size:22px;font-weight:bold}
.nav-right{display:flex;align-items:center;gap:18px}
.user-name{color:#cbd5e1;font-size:14px}
.logout-btn,.nav-btn{background:transparent;border:1px solid #334155;color:#cbd5e1;padding:9px 16px;border-radius:8px;cursor:pointer}
.logout-btn:hover,.nav-btn:hover{background:#1e293b;border-color:#6366f1}

.container{max-width:1100px;margin:auto;padding:40px 20px 60px}
.page-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.header-left h1{font-size:30px;margin-bottom:8px}
.header-left p{color:#94a3b8;font-size:14px}
.header-actions{display:flex;gap:10px}
.nav-btn{background:#1e293b;font-size:13px}

.error-box{display:none;background:#111827;border:1px solid #7f1d1d;color:#fca5a5;border-radius:10px;padding:14px;margin-bottom:20px;text-align:center;font-size:14px}

.upload-card,.document-card,.empty-state,.loading{background:#111827;border:1px solid #1e293b;border-radius:15px}
.upload-card{padding:25px;margin-bottom:32px}
.section-title{margin-bottom:18px}
.section-title h2{font-size:19px;margin-bottom:6px}
.section-title p{color:#64748b;font-size:12px}
.upload-form{display:grid;grid-template-columns:1fr 1.5fr auto;gap:12px;align-items:end}
.form-group label{display:block;color:#cbd5e1;font-size:12px;margin-bottom:7px}
.form-input{width:100%;background:#0f172a;border:1px solid #334155;color:#f8fafc;padding:12px;border-radius:8px;outline:none;font-size:13px}
.form-input:focus{border-color:#6366f1}
.upload-btn{background:#6366f1;border:0;color:white;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.upload-btn:hover{opacity:.9}
.upload-btn:disabled,.ai-btn:disabled{opacity:.5;cursor:not-allowed}
.file-info{color:#64748b;font-size:11px;margin-top:12px}

.documents-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}
.documents-header h2{font-size:20px}
.document-count{color:#94a3b8;font-size:13px}
.documents-grid{display:grid;gap:15px}

.document-card{padding:21px;transition:.2s}
.document-card:hover{border-color:#475569;transform:translateY(-1px)}
.selected-document{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.18)}
.document-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.document-info{display:flex;gap:15px;min-width:0}
.document-icon{width:46px;height:46px;background:#172554;border:1px solid #1e40af;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.document-details{min-width:0}
.document-title{font-size:16px;margin-bottom:6px;word-break:break-word}
.document-file{color:#94a3b8;font-size:12px;word-break:break-word}
.document-meta{color:#64748b;font-size:11px;margin-top:5px}

.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid #1e293b}
.ai-btn{border:1px solid #334155;background:#0f172a;color:#cbd5e1;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:12px;transition:.2s}
.ai-btn:hover{border-color:#6366f1;background:#172033}

.empty-state{padding:60px 25px;text-align:center}
.empty-icon{font-size:48px;margin-bottom:15px}
.empty-state h2{font-size:20px;margin-bottom:8px}
.empty-state p{color:#94a3b8;font-size:14px;line-height:1.6;max-width:500px;margin:auto}
.loading{padding:55px;text-align:center;color:#94a3b8;line-height:1.7}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.78);align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{width:100%;max-width:850px;max-height:85vh;overflow-y:auto;background:#111827;border:1px solid #334155;border-radius:15px;padding:25px}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #1e293b}
.modal-header h2{font-size:20px}
.close-btn{background:transparent;border:0;color:#94a3b8;font-size:24px;cursor:pointer}
.close-btn:hover{color:white}
.summary-content{color:#cbd5e1;font-size:14px;line-height:1.8}
.summary-content h3{color:#f8fafc;font-size:17px;margin:18px 0 8px}
.summary-content h4{color:#e2e8f0;font-size:15px;margin:15px 0 7px}
.summary-content ul{margin-left:22px;margin-bottom:10px}
.summary-content li{margin-bottom:5px}
.summary-content p{margin-bottom:9px}

@media(max-width:850px){
.upload-form{grid-template-columns:1fr}
.upload-btn{width:100%}
}
@media(max-width:700px){
.navbar{padding:0 18px}
.user-name{display:none}
.container{padding:30px 15px 50px}
.page-header{align-items:stretch;flex-direction:column}
.header-left h1{font-size:26px}
.header-actions{display:grid;grid-template-columns:1fr 1fr}
.nav-btn{width:100%}
.document-top{flex-direction:column}
.ai-actions{display:grid;grid-template-columns:1fr}
.ai-btn{width:100%}
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🚀 PrepPilot AI</div>
    <div class="nav-right">
        <span id="userName" class="user-name">Loading...</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <div class="header-left">
            <h1>📄 Study Documents</h1>
            <p>Upload your PDFs and turn them into AI-powered learning material.</p>
        </div>
        <div class="header-actions">
            <button class="nav-btn" onclick="goSubjects()">← Subjects</button>
            <button class="nav-btn" onclick="goDashboard()">← Dashboard</button>
        </div>
    </div>

    <div id="errorBox" class="error-box"></div>

    <section class="upload-card">
        <div class="section-title">
            <h2>📤 Upload Study Material</h2>
            <p>Upload a PDF document to extract its content and use PrepPilot AI.</p>
        </div>

        <form id="uploadForm" class="upload-form">
            <div class="form-group">
                <label for="title">Document Title</label>
                <input id="title" class="form-input" type="text" maxlength="200" placeholder="e.g. Spring Boot Notes" required>
            </div>

            <div class="form-group">
                <label for="file">PDF File</label>
                <input id="file" class="form-input" type="file" accept=".pdf,application/pdf" required>
            </div>

            <button id="uploadBtn" class="upload-btn" type="submit">Upload PDF</button>
        </form>

        <div class="file-info">PDF only • Maximum file size: 10 MB</div>
    </section>

    <section>
        <div class="documents-header">
            <h2>Your Documents</h2>
            <span id="documentCount" class="document-count"></span>
        </div>

        <div id="documents" class="documents-grid">
            <div class="loading">📄 Loading documents...</div>
        </div>
    </section>

</main>

<div id="summaryModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2>✨ AI Summary</h2>
            <button class="close-btn" onclick="closeSummary()">×</button>
        </div>
        <div id="summaryContent" class="summary-content"></div>
    </div>
</div>

<script>
const token=localStorage.getItem("token");

if(!token) window.location.href="/login.html";

const storedName=localStorage.getItem("userName");
if(storedName) document.getElementById("userName").textContent=storedName;

const params=new URLSearchParams(window.location.search);
const subjectId=params.get("subjectId");
const selectedDocumentId=params.get("documentId");

if(subjectId) localStorage.setItem("currentSubjectId",subjectId);

async function loadDocuments(){
    const container=document.getElementById("documents");

    if(!subjectId){
        container.innerHTML=`
            <div class="empty-state">
                <div class="empty-icon">⚠️</div>
                <h2>Subject not selected</h2>
                <p>Please select a subject first.</p>
            </div>`;
        return;
    }

    try{
        const response=await fetch(`http://localhost:8080/api/documents/subject/${subjectId}`,{
            method:"GET",
            headers:{Authorization:"Bearer "+token}
        });

        const data=await response.json().catch(()=>[]);

        if(response.status===401||response.status===403){
            localStorage.clear();
            window.location.href="/login.html";
            return;
        }

        if(!response.ok) throw new Error(data.message||"Unable to load documents.");

        renderDocuments(Array.isArray(data)?data:[]);
    }catch(error){
        console.error(error);
        showError(error.message||"Unable to load documents.");
        container.innerHTML=`
            <div class="empty-state">
                <div class="empty-icon">⚠️</div>
                <h2>Unable to load documents</h2>
                <p>Please check your connection and try again.</p>
            </div>`;
    }
}

function renderDocuments(docs){
    const container=document.getElementById("documents");
    const count=document.getElementById("documentCount");

    count.textContent=`${docs.length} ${docs.length===1?"document":"documents"}`;

    if(!docs.length){
        container.innerHTML=`
            <div class="empty-state">
                <div class="empty-icon">📄</div>
                <h2>No documents yet</h2>
                <p>Upload your first PDF above to start using PrepPilot AI.</p>
            </div>`;
        return;
    }

    container.innerHTML=docs.map(createDocumentCard).join("");
}

function createDocumentCard(doc){
    const title=doc.title||"Untitled Document";
    const fileName=doc.originalFileName||"Unknown file";
    const fileSize=formatFileSize(doc.fileSize);
    const uploadedAt=formatDate(doc.uploadedAt);
    const selected=selectedDocumentId&&Number(selectedDocumentId)===Number(doc.id);

    return `
        <div class="document-card ${selected?"selected-document":""}">
            <div class="document-top">
                <div class="document-info">
                    <div class="document-icon">📄</div>
                    <div class="document-details">
                        <div class="document-title">${escapeHtml(title)}</div>
                        <div class="document-file">${escapeHtml(fileName)}</div>
                        <div class="document-meta">${fileSize}${uploadedAt?" • "+uploadedAt:""}</div>
                    </div>
                </div>
            </div>

            <div class="ai-actions">
                <button class="ai-btn" onclick="generateSummary(${doc.id},this)">✨ Generate AI Summary</button>
                <button class="ai-btn" onclick="openFlashcards(${doc.id})">🧠 AI Flashcards</button>
                <button class="ai-btn" onclick="openQuiz(${doc.id})">📝 AI Quiz</button>
            </div>
        </div>`;
}

document.getElementById("uploadForm").addEventListener("submit",async event=>{
    event.preventDefault();
    hideError();

    if(!subjectId){
        showError("Subject ID is missing.");
        return;
    }

    const title=document.getElementById("title").value.trim();
    const fileInput=document.getElementById("file");
    const file=fileInput.files[0];

    if(!title){
        showError("Document title is required.");
        return;
    }

    if(!file){
        showError("Please select a PDF file.");
        return;
    }

    const isPdf=file.type==="application/pdf"||file.name.toLowerCase().endsWith(".pdf");

    if(!isPdf){
        showError("Only PDF files are allowed.");
        return;
    }

    if(file.size>10*1024*1024){
        showError("File size exceeds the maximum allowed limit of 10 MB.");
        return;
    }

    const uploadBtn=document.getElementById("uploadBtn");
    uploadBtn.disabled=true;
    uploadBtn.textContent="Uploading...";

    try{
        const formData=new FormData();
        formData.append("title",title);
        formData.append("file",file);

        const response=await fetch(`http://localhost:8080/api/documents/subject/${subjectId}`,{
            method:"POST",
            headers:{Authorization:"Bearer "+token},
            body:formData
        });

        const data=await response.json().catch(()=>({}));

        if(response.status===401||response.status===403){
            localStorage.clear();
            window.location.href="/login.html";
            return;
        }

        if(!response.ok) throw new Error(data.message||"Unable to upload document.");

        document.getElementById("uploadForm").reset();
        await loadDocuments();
    }catch(error){
        console.error(error);
        showError(error.message||"Unable to upload document.");
    }finally{
        uploadBtn.disabled=false;
        uploadBtn.textContent="Upload PDF";
    }
});

async function generateSummary(documentId,button){
    hideError();

    const originalText=button.textContent;
    button.disabled=true;
    button.textContent="🤖 Generating...";

    try{
        const response=await fetch(`http://localhost:8080/api/ai/documents/${documentId}/summary`,{
            method:"POST",
            headers:{Authorization:"Bearer "+token}
        });

        const data=await response.json().catch(()=>({}));

        if(response.status===401||response.status===403){
            localStorage.clear();
            window.location.href="/login.html";
            return;
        }

        if(!response.ok) throw new Error(data.message||"Unable to generate AI summary.");

        document.getElementById("summaryContent").innerHTML=formatMarkdown(
            data.summary||"No summary was generated."
        );
        document.getElementById("summaryModal").style.display="flex";
    }catch(error){
        console.error(error);
        showError(error.message||"Unable to generate AI summary.");
    }finally{
        button.disabled=false;
        button.textContent=originalText;
    }
}

function openFlashcards(documentId){
    window.location.href=`/flashcards.html?documentId=${documentId}`;
}

function openQuiz(documentId){
    window.location.href=`/quiz.html?documentId=${documentId}`;
}

function closeSummary(){
    document.getElementById("summaryModal").style.display="none";
}

document.getElementById("summaryModal").addEventListener("click",event=>{
    if(event.target===event.currentTarget) closeSummary();
});

function goSubjects(){
    window.location.href="/subjects.html";
}

function goDashboard(){
    window.location.href="/dashboard.html";
}

function logout(){
    ["token","userId","userName","userEmail","currentSubjectId"].forEach(key=>{
        localStorage.removeItem(key);
    });
    window.location.href="/login.html";
}

function showError(message){
    const box=document.getElementById("errorBox");
    box.textContent=message;
    box.style.display="block";
    setTimeout(()=>box.style.display="none",5000);
}

function hideError(){
    document.getElementById("errorBox").style.display="none";
}

function formatFileSize(bytes){
    if(bytes===null||bytes===undefined||bytes===0) return "";

    const units=["B","KB","MB","GB"];
    let size=Number(bytes),index=0;

    while(size>=1024&&index<units.length-1){
        size/=1024;
        index++;
    }

    return size.toFixed(index===0?0:1)+" "+units[index];
}

function formatDate(value){
    if(!value) return "";

    const date=new Date(value);
    if(isNaN(date.getTime())) return "";

    return date.toLocaleDateString("en-IN",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function formatMarkdown(text){
    let html=escapeHtml(text);

    html=html.replace(/^###\s*\*\*(.*?)\*\*$/gm,"<h3>$1</h3>");
    html=html.replace(/^###\s*(.*?)$/gm,"<h3>$1</h3>");
    html=html.replace(/^##\s*\*\*(.*?)\*\*$/gm,"<h3>$1</h3>");
    html=html.replace(/^##\s*(.*?)$/gm,"<h3>$1</h3>");
    html=html.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
    html=html.replace(/^\s*[-*]\s+(.*?)$/gm,"<li>$1</li>");

    html=html.replace(/(<li>.*?<\/li>\s*)+/gs,match=>`<ul>${match}</ul>`);
    html=html.replace(/\n{2,}/g,"</p><p>");
    html="<p>"+html+"</p>";
    html=html.replace(/<p>\s*<\/p>/g,"");

    return html;
}

function escapeHtml(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

loadDocuments();
</script>

</body>
</html>
