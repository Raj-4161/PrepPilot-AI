<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flashcards | PrepPilot AI</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;

            background: #111827;

            border-bottom: 1px solid #1e293b;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;
        }


        .logo {
            color: #6366f1;

            font-size: 22px;

            font-weight: bold;
        }


        .nav-right {
            display: flex;

            align-items: center;

            gap: 18px;
        }


        .user-name {
            color: #cbd5e1;

            font-size: 14px;
        }


        .logout-btn {
            background: transparent;

            border: 1px solid #334155;

            color: #cbd5e1;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;
        }


        .logout-btn:hover {
            background: #1e293b;
        }


        /* ================= MAIN ================= */

        .container {
            max-width: 1100px;

            margin: auto;

            padding: 40px 20px 60px;
        }


        /* ================= HEADER ================= */

        .page-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }


        .header-left h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }


        .header-left p {
            color: #94a3b8;

            font-size: 14px;
        }


        .header-actions {
            display: flex;

            gap: 10px;
        }


        .nav-btn {
            background: #1e293b;

            border: 1px solid #334155;

            color: #e2e8f0;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 13px;
        }


        .nav-btn:hover {
            border-color: #6366f1;
        }


        /* ================= INFO ================= */

        .info-card {
            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }


        .info-left {
            display: flex;

            align-items: center;

            gap: 14px;
        }


        .info-icon {
            width: 45px;
            height: 45px;

            border-radius: 10px;

            background: #1e1b4b;

            border: 1px solid #312e81;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;
        }


        .info-text h2 {
            font-size: 16px;

            margin-bottom: 5px;
        }


        .info-text p {
            color: #64748b;

            font-size: 12px;
        }


        .card-count {
            color: #94a3b8;

            font-size: 13px;
        }


        /* ================= GENERATE ================= */

        .generate-section {
            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 14px;

            padding: 22px;

            margin-bottom: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;
        }


        .generate-text h2 {
            font-size: 17px;

            margin-bottom: 6px;
        }


        .generate-text p {
            color: #94a3b8;

            font-size: 12px;

            line-height: 1.5;
        }


        .generate-btn {
            background: #6366f1;

            border: none;

            color: white;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            white-space: nowrap;
        }


        .generate-btn:hover {
            opacity: 0.9;
        }


        .generate-btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        /* ================= FLASHCARD GRID ================= */

        .flashcards-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .flashcard {
            min-height: 210px;

            perspective: 1000px;

            cursor: pointer;
        }


        .flashcard-inner {
            position: relative;

            width: 100%;

            min-height: 210px;

            transition:
                transform 0.55s;

            transform-style: preserve-3d;
        }


        .flashcard.flipped
        .flashcard-inner {
            transform:
                rotateY(180deg);
        }


        .flashcard-front,
        .flashcard-back {
            position: absolute;

            width: 100%;

            min-height: 210px;

            backface-visibility: hidden;

            -webkit-backface-visibility: hidden;

            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 14px;

            padding: 24px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .flashcard-front:hover,
        .flashcard-back:hover {
            border-color: #475569;
        }


        .card-label {
            color: #818cf8;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 0.6px;

            margin-bottom: 13px;
        }


        .question {
            font-size: 16px;

            line-height: 1.6;

            font-weight: 600;
        }


        .answer {
            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.7;
        }


        .click-hint {
            color: #64748b;

            font-size: 11px;

            margin-top: 18px;
        }


        .flashcard-back {
            transform:
                rotateY(180deg);

            background: #121c30;
        }


        /* ================= EMPTY ================= */

        .empty-state {
            grid-column: 1 / -1;

            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 15px;

            padding: 60px 25px;

            text-align: center;
        }


        .empty-icon {
            font-size: 48px;

            margin-bottom: 15px;
        }


        .empty-state h2 {
            font-size: 20px;

            margin-bottom: 8px;
        }


        .empty-state p {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;

            max-width: 500px;

            margin: auto;
        }


        /* ================= LOADING ================= */

        .loading {
            grid-column: 1 / -1;

            background: #111827;

            border: 1px solid #1e293b;

            border-radius: 15px;

            padding: 55px;

            text-align: center;

            color: #94a3b8;

            line-height: 1.7;
        }


        /* ================= ERROR ================= */

        .error-box {
            display: none;

            background: #111827;

            border: 1px solid #7f1d1d;

            color: #fca5a5;

            border-radius: 10px;

            padding: 14px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .flashcards-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 700px) {

            .navbar {
                padding: 0 18px;
            }


            .user-name {
                display: none;
            }


            .container {
                padding: 30px 15px 50px;
            }


            .page-header {
                flex-direction: column;

                align-items: stretch;
            }


            .header-left h1 {
                font-size: 26px;
            }


            .header-actions {
                display: grid;

                grid-template-columns: 1fr 1fr;
            }


            .nav-btn {
                width: 100%;
            }


            .info-card {
                align-items: flex-start;

                flex-direction: column;
            }


            .generate-section {
                align-items: stretch;

                flex-direction: column;
            }


            .generate-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🚀 PrepPilot AI
        </div>


        <div class="nav-right">

            <span
                id="userName"
                class="user-name">
                Loading...
            </span>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>



    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- ================= HEADER ================= -->

        <div class="page-header">


            <div class="header-left">

                <h1>
                    🧠 AI Flashcards
                </h1>

                <p>
                    Strengthen your memory with AI-generated question and answer cards.
                </p>

            </div>


            <div class="header-actions">

                <button
                    class="nav-btn"
                    onclick="goDocuments()">

                    ← Documents

                </button>


                <button
                    class="nav-btn"
                    onclick="goDashboard()">

                    ← Dashboard

                </button>

            </div>


        </div>



        <div
            id="errorBox"
            class="error-box">
        </div>



        <!-- ================= INFO ================= -->

        <section class="info-card">


            <div class="info-left">


                <div class="info-icon">
                    🧠
                </div>


                <div class="info-text">

                    <h2>
                        Active Recall
                    </h2>

                    <p>
                        Click any flashcard to reveal its answer.
                    </p>

                </div>


            </div>


            <span
                id="cardCount"
                class="card-count">

                0 cards

            </span>


        </section>



        <!-- ================= GENERATE ================= -->

        <section class="generate-section">


            <div class="generate-text">

                <h2>
                    ✨ Generate New Flashcards
                </h2>

                <p>
                    Let create 10 useful flashcards
                    from your study material.
                </p>

            </div>


            <button
                id="generateBtn"
                class="generate-btn"
                onclick="generateFlashcards()">

                ✨ Generate Flashcards

            </button>


        </section>



        <!-- ================= FLASHCARDS ================= -->

        <section
            id="flashcards"
            class="flashcards-grid">

            <div class="loading">

                🧠 Loading flashcards...

            </div>

        </section>


    </main>



    <script>


        // =====================================================
        // AUTH
        // =====================================================

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "/login.html";

        }


        // =====================================================
        // USER
        // =====================================================

        const storedName =
            localStorage.getItem("userName");


        if (storedName) {

            document.getElementById(
                "userName"
            ).textContent = storedName;

        }



        // =====================================================
        // DOCUMENT ID
        // =====================================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const documentId =
            params.get("documentId");


        // =====================================================
        // LOAD FLASHCARDS
        // =====================================================

        async function loadFlashcards() {


            const container =
                document.getElementById(
                    "flashcards"
                );


            if (!documentId) {

                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Document not selected
                        </h2>

                        <p>
                            Please select a document first
                            to view its flashcards.
                        </p>

                    </div>

                `;

                return;

            }


            try {


                const response =
                    await fetch(
                        "http://localhost:8080/api/flashcards/document/"
                        + documentId,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json()
                        .catch(() => []);


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load flashcards."
                    );

                }


                renderFlashcards(
                    Array.isArray(data)
                        ? data
                        : []
                );


            } catch (error) {

                console.error(error);


                showError(
                    error.message ||
                    "Unable to load flashcards."
                );


                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Unable to load flashcards
                        </h2>

                        <p>
                            Please check your connection
                            and try again.
                        </p>

                    </div>

                `;

            }

        }



        // =====================================================
        // RENDER FLASHCARDS
        // =====================================================

        function renderFlashcards(
            flashcards
        ) {


            const container =
                document.getElementById(
                    "flashcards"
                );


            const count =
                document.getElementById(
                    "cardCount"
                );


            count.textContent =
                flashcards.length
                + (
                    flashcards.length === 1
                        ? " card"
                        : " cards"
                );


            if (!flashcards.length) {


                container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            🧠
                        </div>

                        <h2>
                            No flashcards yet
                        </h2>

                        <p>
                            Click "Generate Flashcards"
                            to create AI-powered study cards
                            from this document.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                flashcards
                    .map(
                        (card, index) =>
                            createFlashcard(
                                card,
                                index
                            )
                    )
                    .join("");

        }



        // =====================================================
        // CREATE FLASHCARD
        // =====================================================

        function createFlashcard(
            card,
            index
        ) {


            return `

                <div
                    class="flashcard"
                    onclick="flipCard(this)">


                    <div class="flashcard-inner">


                        <!-- FRONT -->

                        <div class="flashcard-front">


                            <div class="card-label">

                                QUESTION ${index + 1}

                            </div>


                            <div class="question">

                                ${escapeHtml(
                                    card.question ||
                                    "No question available."
                                )}

                            </div>


                            <div class="click-hint">

                                Click to reveal answer →

                            </div>


                        </div>


                        <!-- BACK -->

                        <div class="flashcard-back">


                            <div class="card-label">

                                ANSWER

                            </div>


                            <div class="answer">

                                ${escapeHtml(
                                    card.answer ||
                                    "No answer available."
                                )}

                            </div>


                            <div class="click-hint">

                                Click to see question →

                            </div>


                        </div>


                    </div>


                </div>

            `;

        }



        // =====================================================
        // FLIP CARD
        // =====================================================

        function flipCard(
            card
        ) {

            card.classList.toggle(
                "flipped"
            );

        }



        // =====================================================
        // GENERATE FLASHCARDS
        // =====================================================

        async function generateFlashcards() {


            if (!documentId) {

                showError(
                    "Document ID is missing."
                );

                return;

            }


            hideError();


            const button =
                document.getElementById(
                    "generateBtn"
                );


            button.disabled = true;

            button.textContent =
                "🤖 Generating...";


            try {


                const response =
                    await fetch(
                        "http://localhost:8080/api/flashcards/documents/"
                        + documentId
                        + "/generate",
                        {
                            method: "POST",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json()
                        .catch(() => []);


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to generate flashcards."
                    );

                }


                renderFlashcards(
                    Array.isArray(data)
                        ? data
                        : []
                );


            } catch (error) {

                console.error(error);


                showError(
                    error.message ||
                    "Unable to generate flashcards."
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "✨ Generate Flashcards";

            }

        }



        // =====================================================
        // NAVIGATION
        // =====================================================

        function goDocuments() {


            const currentSubjectId =
                localStorage.getItem(
                    "currentSubjectId"
                );


            if (currentSubjectId) {

                window.location.href =
                    "/documents.html?subjectId="
                    + currentSubjectId;

            } else {

                window.location.href =
                    "/subjects.html";

            }

        }


        function goDashboard() {

            window.location.href =
                "/dashboard.html";

        }



        // =====================================================
        // LOGOUT
        // =====================================================

        function logout() {


            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "userId"
            );

            localStorage.removeItem(
                "userName"
            );

            localStorage.removeItem(
                "userEmail"
            );

            localStorage.removeItem(
                "currentSubjectId"
            );


            window.location.href =
                "/login.html";

        }



        // =====================================================
        // ERROR
        // =====================================================

        function showError(
            message
        ) {


            const box =
                document.getElementById(
                    "errorBox"
                );


            box.textContent =
                message;


            box.style.display =
                "block";


            setTimeout(
                function() {

                    box.style.display =
                        "none";

                },
                5000
            );

        }


        function hideError() {

            document.getElementById(
                "errorBox"
            ).style.display =
                "none";

        }



        // =====================================================
        // HTML ESCAPE
        // =====================================================

        function escapeHtml(
            value
        ) {


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // =====================================================
        // INITIAL LOAD
        // =====================================================

        loadFlashcards();


    </script>


</body>

</html>
