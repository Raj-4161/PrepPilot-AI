<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz History | PrepPilot AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            color: #6366f1;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-name {
            color: #cbd5e1;
            font-size: 14px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #1e293b;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 40px 20px 60px;
        }

        /* ================= HEADER ================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header-left h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header-left p {
            color: #94a3b8;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-btn:hover {
            border-color: #6366f1;
        }

        /* ================= SUMMARY ================= */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 22px;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .summary-value {
            font-size: 27px;
            font-weight: bold;
        }

        .summary-subtext {
            color: #64748b;
            font-size: 11px;
            margin-top: 6px;
        }

        /* ================= SECTION ================= */

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* ================= HISTORY ================= */

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .attempt-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .attempt-card:hover {
            border-color: #334155;
        }

        .attempt-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .attempt-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #1e1b4b;
            border: 1px solid #312e81;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .attempt-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .attempt-date {
            color: #64748b;
            font-size: 12px;
        }

        .attempt-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .score-block {
            text-align: right;
        }

        .score {
            font-size: 18px;
            font-weight: bold;
        }

        .percentage {
            color: #818cf8;
            font-size: 13px;
            margin-top: 4px;
        }

        /* ================= BADGES ================= */

        .badge {
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            background: #1e293b;
            color: #cbd5e1;
        }

        /* ================= EMPTY ================= */

        .empty-state {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 15px;
            padding: 65px 25px;
            text-align: center;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            max-width: 500px;
            margin: auto;
        }

        /* ================= LOADING ================= */

        .loading {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            color: #94a3b8;
        }

        /* ================= ERROR ================= */

        .error-box {
            display: none;
            background: #111827;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .attempt-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .attempt-right {
                width: 100%;
                justify-content: space-between;
            }

            .score-block {
                text-align: left;
            }

        }

        @media (max-width: 650px) {

            .navbar {
                padding: 0 18px;
            }

            .user-name {
                display: none;
            }

            .container {
                padding: 30px 15px 50px;
            }

            .page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-left h1 {
                font-size: 26px;
            }

            .header-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .nav-btn {
                width: 100%;
            }

            .attempt-right {
                align-items: center;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            🚀 PrepPilot AI
        </div>

        <div class="nav-right">

            <span
                id="userName"
                class="user-name">
                Loading...
            </span>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- HEADER -->

        <div class="page-header">

            <div class="header-left">

                <h1>
                    📊 Quiz History
                </h1>

                <p>
                    Track your quiz performance and monitor your progress.
                </p>

            </div>


            <div class="header-actions">

                <button
                    class="nav-btn"
                    onclick="goDashboard()">

                    ← Dashboard

                </button>


                <button
                    class="nav-btn"
                    onclick="goSubjects()">

                    📚 Subjects

                </button>

            </div>

        </div>


        <!-- ERROR -->

        <div
            id="errorBox"
            class="error-box">
        </div>


        <!-- SUMMARY -->

        <div
            id="summary"
            class="summary-grid">

            <div class="summary-card">

                <div class="summary-label">
                    TOTAL ATTEMPTS
                </div>

                <div
                    id="totalAttempts"
                    class="summary-value">
                    0
                </div>

                <div class="summary-subtext">
                    Quizzes completed
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    AVERAGE SCORE
                </div>

                <div
                    id="averageScore"
                    class="summary-value">
                    0%
                </div>

                <div class="summary-subtext">
                    Across all attempts
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    BEST SCORE
                </div>

                <div
                    id="bestScore"
                    class="summary-value">
                    0%
                </div>

                <div class="summary-subtext">
                    Your highest performance
                </div>

            </div>

        </div>


        <!-- HISTORY -->

        <h2 class="section-title">
            Recent Attempts
        </h2>


        <div
            id="history"
            class="history-list">

            <div class="loading">

                📊 Loading quiz history...

            </div>

        </div>


    </main>


    <script>


        // =====================================================
        // AUTH
        // =====================================================

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "/login.html";

        }


        const storedName =
            localStorage.getItem("userName");


        if (storedName) {

            document.getElementById(
                "userName"
            ).textContent = storedName;

        }


        // =====================================================
        // LOAD HISTORY
        // =====================================================

        async function loadHistory() {


            const history =
                document.getElementById(
                    "history"
                );


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/api/quizzes/attempts/my",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json()
                        .catch(() => []);


                if (
                    response.status === 401 ||
                    response.status === 403
                ) {

                    localStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load quiz history."
                    );

                }


                const attempts =
                    Array.isArray(data)
                        ? data
                        : [];


                updateSummary(
                    attempts
                );


                renderHistory(
                    attempts
                );


            } catch (error) {

                console.error(error);

                showError(
                    error.message ||
                    "Unable to load quiz history."
                );


                history.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <h2>
                            Unable to load history
                        </h2>

                        <p>
                            Please check your connection
                            and try again.
                        </p>

                    </div>

                `;

            }

        }


        // =====================================================
        // SUMMARY
        // =====================================================

        function updateSummary(
            attempts
        ) {


            const total =
                attempts.length;


            let totalPercentage = 0;

            let best = 0;


            attempts.forEach(
                attempt => {

                    const percentage =
                        Number(
                            attempt.percentage || 0
                        );


                    totalPercentage +=
                        percentage;


                    if (
                        percentage > best
                    ) {

                        best = percentage;

                    }

                }
            );


            const average =
                total > 0
                    ? totalPercentage / total
                    : 0;


            document.getElementById(
                "totalAttempts"
            ).textContent = total;


            document.getElementById(
                "averageScore"
            ).textContent =
                average.toFixed(1) + "%";


            document.getElementById(
                "bestScore"
            ).textContent =
                best.toFixed(1) + "%";

        }


        // =====================================================
        // RENDER HISTORY
        // =====================================================

        function renderHistory(
            attempts
        ) {


            const history =
                document.getElementById(
                    "history"
                );


            if (!attempts.length) {

                history.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📝
                        </div>

                        <h2>
                            No quiz attempts yet
                        </h2>

                        <p>
                            Complete an AI quiz to see
                            your performance history here.
                        </p>

                    </div>

                `;

                return;

            }


            // Newest attempts first

            attempts.sort(
                (a, b) => {

                    const dateA =
                        new Date(
                            a.attemptedAt || 0
                        ).getTime();

                    const dateB =
                        new Date(
                            b.attemptedAt || 0
                        ).getTime();

                    return dateB - dateA;

                }
            );


            history.innerHTML =
                attempts
                    .map(
                        attempt =>
                            createAttemptCard(
                                attempt
                            )
                    )
                    .join("");

        }


        // =====================================================
        // ATTEMPT CARD
        // =====================================================

        function createAttemptCard(
            attempt
        ) {


            const percentage =
                Number(
                    attempt.percentage || 0
                );


            const score =
                attempt.score || 0;


            const total =
                attempt.totalQuestions || 0;


            let badge =
                "Needs Practice";


            if (percentage >= 80) {

                badge =
                    "Excellent";

            } else if (percentage >= 60) {

                badge =
                    "Good";

            } else if (percentage >= 40) {

                badge =
                    "Keep Practicing";

            }


            const date =
                formatDate(
                    attempt.attemptedAt
                );


            return `

                <div class="attempt-card">


                    <div class="attempt-left">


                        <div class="attempt-icon">

                            📝

                        </div>


                        <div>

                            <div class="attempt-title">

                                Quiz #${escapeHtml(
                                    attempt.quizId
                                )}

                            </div>


                            <div class="attempt-date">

                                ${date}

                            </div>

                        </div>


                    </div>


                    <div class="attempt-right">


                        <span class="badge">

                            ${badge}

                        </span>


                        <div class="score-block">

                            <div class="score">

                                ${score} / ${total}

                            </div>


                            <div class="percentage">

                                ${percentage.toFixed(1)}%

                            </div>

                        </div>


                    </div>


                </div>

            `;

        }


        // =====================================================
        // DATE FORMAT
        // =====================================================

        function formatDate(
            value
        ) {


            if (!value) {

                return "Date unavailable";

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "Date unavailable";

            }


            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // =====================================================
        // NAVIGATION
        // =====================================================

        function goDashboard() {

            window.location.href =
                "/dashboard.html";

        }


        function goSubjects() {

            window.location.href =
                "/subjects.html";

        }


        // =====================================================
        // LOGOUT
        // =====================================================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "userId"
            );

            localStorage.removeItem(
                "userName"
            );

            localStorage.removeItem(
                "userEmail"
            );

            localStorage.removeItem(
                "currentSubjectId"
            );


            window.location.href =
                "/login.html";

        }


        // =====================================================
        // ERROR
        // =====================================================

        function showError(
            message
        ) {

            const box =
                document.getElementById(
                    "errorBox"
                );


            box.textContent =
                message;


            box.style.display =
                "block";


            setTimeout(
                () => {

                    box.style.display =
                        "none";

                },
                5000
            );

        }


        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // =====================================================
        // START
        // =====================================================

        loadHistory();

    </script>

</body>

</html>
